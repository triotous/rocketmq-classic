publish = false

[dependencies]
rocketmq-classic-common = { path = "../rocketmq-classic-common" }
rocketmq-classic-protocol = { path = "../rocketmq-classic-protocol" }
rocketmq-classic-remoting = { path = "../rocketmq-classic-remoting" }
serde_json.workspace = true
yaml_serde.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
reqwest.workspace = true
tokio-rustls.workspace = true
hostname.workspace = true
rand.workspace = true
hmac.workspace = true
sha1.workspace = true
sha2.workspace = true
md-5.workspace = true
base64.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
