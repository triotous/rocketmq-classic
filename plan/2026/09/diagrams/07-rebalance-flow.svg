 <path d="M385 147H470" class="a"/><path d="M770 147H855" class="a"/>
 <polygon points="1285,110 1385,160 1285,210 1185,160" class="d"/><text x="1220" y="154" class="h">model?</text><text x="1210" y="178" class="t">cluster/broadcast</text>
 <path d="M1155 147H1185" class="a"/>
 <rect x="1110" y="300" width="350" height="100" class="b"/><text x="1135" y="338" class="h">BROADCASTING</text><text x="1135" y="366" class="t">assign all queues to this consumer</text>
 <rect x="720" y="300" width="330" height="120" class="b"/><text x="745" y="338" class="h">CLUSTERING</text><text x="745" y="366" class="t">sort mqAll + cidAll exactly</text><text x="745" y="392" class="t">run allocation strategy</text>
 <path d="M1285 210V300" class="a"/><path d="M1185 160C1100 220 975 250 930 300" class="a"/>
