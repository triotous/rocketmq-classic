 <path d="M720 360H645" class="a"/><path d="M1110 350C900 480 700 430 645 385" class="a"/>
 <rect x="85" y="535" width="350" height="135" class="b"/><text x="110" y="573" class="h">remove queues no longer assigned</text><text x="110" y="601" class="t">mark ProcessQueue dropped</text><text x="110" y="627" class="t">persist offset / unlock if orderly</text><text x="110" y="653" class="t">remove state only when safe</text>
 <rect x="575" y="535" width="350" height="135" class="b"/><text x="600" y="573" class="h">keep unchanged queues</text><text x="600" y="601" class="t">preserve ProcessQueue identity</text><text x="600" y="627" class="t">do not reset offset</text>
 <rect x="1065" y="535" width="350" height="135" class="b"/><text x="1090" y="573" class="h">add newly assigned queues</text><text x="1090" y="601" class="t">removeDirtyOffset → computeFromWhere</text><text x="1090" y="627" class="t">lock first if orderly</text><text x="1090" y="653" class="t">create PullRequest</text>
 <path d="M515 415C390 465 260 480 260 535" class="a"/><path d="M515 415C600 465 750 480 750 535" class="a"/><path d="M515 415C740 455 1240 455 1240 535" class="a"/>
 <rect x="490" y="770" width="520" height="105" class="b"/><text x="515" y="808" class="h">dispatch pull requests + messageQueueChanged callback</text><text x="515" y="836" class="t">new assignment becomes active; wake pull loop</text>
 <path d="M260 670C350 735 480 735 580 770" class="a"/><path d="M750 670V770" class="a"/><path d="M1240 670C1150 735 1030 735 920 770" class="a"/>
 <text x="85" y="940" class="t">Compatibility risk: sorting order, allocation strategy edge cases, dropped queue timing, orderly lock state and offset persistence must all be tested differentially against Java 5.5.1.</text>
