  <defs><style>.title{font:700 30px Arial;fill:#172033}.h{font:600 17px Arial;fill:#172033}.t{font:15px Arial;fill:#344054}.b{fill:#f8fafc;stroke:#475467;stroke-width:2;rx:12}.core{fill:#eef4ff;stroke:#5b7cfa;stroke-width:2;rx:12}.a{stroke:#667085;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#667085"/></marker></defs>
