[workspace]
resolver = "3"
members = [
    "crates/rocketmq-classic-common",
    "crates/rocketmq-classic-core",
    "crates/rocketmq-classic-protocol",
    "crates/rocketmq-classic-remoting",
    "crates/rocketmq-classic-producer",
    "crates/rocketmq-classic",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
thiserror = "2.0"
bytes = "1.10.1"
socket2 = "0.6.5"
tokio = { version = "1.49.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26.4"
tokio-socks = "0.5.2"
rustls-native-certs = "0.8.2"
rustls-pemfile = "2.2.0"
rcgen = "0.13.2"
rand = "0.9.2"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots-no-provider"] }
libc = "0.2.189"
hostname = "0.4.2"
windows-sys = { version = "0.61.2", features = ["Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
pkcs8 = { version = "0.10.2", features = ["3des", "encryption", "pem", "sha1-insecure"] }
des = { version = "0.8.1", features = ["zeroize"] }
md-5 = "0.10.6"
base64 = "0.22.1"
cbc = { version = "0.1.2", features = ["alloc", "block-padding"] }
cipher = "0.4.4"
flate2 = "1.1.9"
lz4_flex = { version = "0.12.2", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
xxhash-rust = { version = "0.8.18", features = ["xxh32"] }
zstd = "0.13.3"
