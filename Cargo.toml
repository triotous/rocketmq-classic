[workspace]
resolver = "3"
members = [
    "crates/rocketmq-classic-common",
    "crates/rocketmq-classic-protocol",
    "crates/rocketmq-classic-remoting",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
bytes = "1.10.1"
socket2 = "0.6.5"
tokio = { version = "1.49.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26.4"
tokio-socks = "0.5.2"
rustls-native-certs = "0.8.2"
rustls-pemfile = "2.2.0"
rcgen = "0.13.2"
rand = "0.9.2"
