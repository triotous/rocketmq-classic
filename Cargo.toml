[workspace]
resolver = "3"
members = [
    "crates/rocketmq-classic-common",
    "crates/rocketmq-classic-protocol",
    "crates/rocketmq-classic-remoting",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
bytes = "1.10.1"
