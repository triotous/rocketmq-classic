name: Rust checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
          cache-dependency-path: compat/java-reference/pom.xml
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Clear check artifacts before linking workspace tests
        run: cargo clean
      - run: cargo test --workspace --locked
      - name: Clear default-feature test artifacts
        run: cargo clean
      - run: cargo test --workspace --all-features --locked
      - name: Clear test artifacts before remaining gates
        run: cargo clean
      - run: TZ=Asia/Taipei cargo test -p rocketmq-classic-core --lib unique_id::tests::public_unique_id_helpers_match_the_pinned_java_fixture --locked
      - run: python3 tests/differential/compare.py --self-test
      - run: python3 tests/differential/compare.py --validate-manifest
      - run: cargo run -p rocketmq-classic-remoting --example fuzz_smoke --locked
      - run: bash tests/stress/run-offline-smoke.sh
      - run: mvn -f compat/java-reference/pom.xml verify
      - run: cargo build -p rocketmq-classic --examples --release --locked
      - run: cargo bench -p rocketmq-classic --bench offline --locked --no-run
      - run: scripts/check-workspace-metadata.py

  windows-stack-runtime:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ROCKETMQ_WINDOWS_STACK_DEBUG: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
      - name: Run the native Windows stack capture regression
        shell: bash
        run: |
          output="$(cargo test --locked -p rocketmq-classic-consumer --lib stack::tests::jstack_includes_current_and_other_named_threads -- --exact --nocapture 2>&1)" || {
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"
          grep -q 'test result: ok\. 1 passed; 0 failed' <<<"$output"
